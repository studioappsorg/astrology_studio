# AstrologyStudio ·
# .github/workflows/ci.yml
#
# Checks every push and pull request:
#
# server tests and linting, the web app's types, unit tests and build, browser tests of the main
# paths, and the installer script.
#
# Copyright (c) 2026 Gavin Melhuish
# MIT License; see LICENSE in the project root.
# SPDX-License-Identifier: MIT

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy astrologystudio
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    # The main paths through the app in Chromium: the built web app against this server, with the
    # stand-in ephemeralREST the server tests use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: npm ci && npm run build
        working-directory: web
      - run: pip install -e ".[dev,e2e]" && python -m playwright install --with-deps chromium
        working-directory: server
      - run: pytest -m e2e -q -rf
        working-directory: server
      # A screenshot of the page at the moment each browser test failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-failures
          path: server/e2e-failures/
          if-no-files-found: ignore

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint the installer
        run: shellcheck install/install.sh scripts/*.sh
      - name: Dry run, as people run it (piped into bash)
        run: |
          bash install/install.sh --dry-run --dir "$RUNNER_TEMP/as" --domain astro.example.com < /dev/null
          shellcheck "$RUNNER_TEMP/as/astrologystudio"
          docker compose --project-directory "$RUNNER_TEMP/as" config --quiet