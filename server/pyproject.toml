# AstrologyStudio ·
# server/pyproject.toml
#
# The server's package:
#
# dependencies, the astrologystudio command, and settings for ruff, mypy and pytest.
#
# Copyright (c) 2026 Gavin Melhuish
# MIT License; see LICENSE in the project root.
# SPDX-License-Identifier: MIT

[project]
name = "astrologystudio"
version = "1.21.4"
description = "Astrology charts and cosmobiology, self-hosted. Calculations by ephemeralREST."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
# fonttools and brotli are for web/fonts/make-glyph-font.py, which rebuilds the symbol font.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "fonttools>=4.47", "brotli>=1.1"]
e2e = ["playwright>=1.45", "uvicorn>=0.30"]

[project.scripts]
astrologystudio = "astrologystudio.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrologystudio*"]

[tool.setuptools.package-data]
astrologystudio = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests run on their own: pytest -m e2e (see tests/e2e/conftest.py).
addopts = "-m 'not e2e'"
markers = ["e2e: browser tests (need Playwright and the built web app)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["astrologystudio"]
